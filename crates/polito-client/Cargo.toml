[package]
name = "polito-client"
version = "0.1.0"
edition = "2024"

[dependencies]
polito-api = { path = "../polito-api" }
thiserror = "2.0.18"
reqwest = { version = "0.13", features = ["json"] }
tokio = { version = "1", features = ["full"] }
reqwest-middleware = "0.5"
async-trait = "0.1"
http = "1"
url = "2.5"
k256 = { version = "0.14.0", features = ["ecdsa", "sha256"] }
data-encoding = "2.11.1"
zeroize = "1.9.2"
chrono = "0.4"
getrandom = "0.4"
uuid = { version = "1", default-features = false }

[dev-dependencies]
anyhow = "1.0"
dotenvy = "0.15.7"
libtest-mimic = "0.8.2"

[[test]]
name = "integration"
path = "testing/integration/main.rs"
harness = false

[[test]]
name = "e2e"
path = "testing/e2e/main.rs"
harness = false
test = false
