[package]
name = "polito-client"
version = "0.1.0"
edition = "2024"

[dependencies]
polito-api = { path = "../polito-api" }
thiserror = "2.0.18"
reqwest = { version = "0.13", features = ["json"] }
tokio = { version = "1", features = ["full"] }
reqwest-middleware = "0.5"
async-trait = "0.1"
http = "1"
url = "2.5"

[dev-dependencies]
anyhow = "1.0"
dotenvy = "0.15.7"
libtest-mimic = "0.8.2"

# integration tests against a Prism mock
[[test]]
name = "mock"
path = "tests/mock/main.rs"
harness = false
